name: pull-drive
on:
  schedule:
    - cron: '15-55/10 3 * * *'  # every 10 min, 06:15–06:55 Türkiye (task fires 06:00)
    - cron: '30 4-12 * * *'     # then hourly catch-up, 07:30–15:30 Türkiye
  workflow_dispatch:
permissions:
  contents: write
concurrency: publish
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install markdown pyyaml requests google-auth
      - name: Pull reports from Drive
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          DRIVE_FOLDER_ID: 1Bqj-FeX9IwOD9na53Ze7RteepjxRCCGB
        run: python3 scripts/pull_drive.py
      # Pushes made with GITHUB_TOKEN don't trigger build.yml, so build here.
      - id: publish
        if: always()
        run: |
          git status --porcelain source | grep -q . || exit 0
          python3 build.py
          git config user.name "defintel-bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "report: $(date -u +%F) from Drive"
          git pull --rebase --autostash origin main
          git push
          echo "published=yes" >> "$GITHUB_OUTPUT"

      # Structure check runs AFTER publishing on purpose: a report with a broken
      # cross-reference still goes out, but the run fails so GitHub emails us.
      - name: Check report structure
        if: always()
        run: python3 scripts/check_reports.py

      # Tell the push service a new report is out, so phones get a notification.
      - if: steps.publish.outputs.published == 'yes'
        env:
          PUSH_URL: ${{ secrets.PUSH_URL }}
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
        run: |
          [ -n "$PUSH_URL" ] || { echo "no push service configured"; exit 0; }
          code=$(curl -s -o /tmp/notify.out -w '%{http_code}' -X POST "$PUSH_URL/notify" \
            -H "Authorization: Bearer $NOTIFY_SECRET")
          echo "notify: $code $(cat /tmp/notify.out)"
          [ "$code" = "200" ]
