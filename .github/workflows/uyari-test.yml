name: uyari-test
# Rev 30 kanıt iş akışı: scripts/uyari.py gerçek GitHub'a karşı, "[TEST] " önekli başlıkla.
# Üç ardışık iş = aynı gün üç çalıştırma:
#   1) iki uyarı → günün [TEST] issue'su açılır (ve yerel sahte-API testi koşar)
#   2) aynı KUR uyarısı + bir yeni → aynı issue'ya yalnızca yeni satır + tek yorum
#   3) uyarı yok → issue'ya dokunulmaz, (A) "uyarı yok"
# Yalnız rev21-33 dalında koşar; main'e alınmadan önce silinebilir. Sır yok (GITHUB_TOKEN).
on:
  push:
    branches: [rev21-33]
    paths: ['scripts/uyari.py', '.github/workflows/uyari-test.yml']
  workflow_dispatch:
permissions:
  issues: write
  contents: read
concurrency: uyari-test
env:
  UYARI_TEST_ONEK: "[TEST] "
  GITHUB_TOKEN: ${{ github.token }}
jobs:
  uyarili:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Yerel test (sahte GitHub API)
        run: python3 scripts/test_uyari.py
      - name: Uyarı 1 — KUR
        run: 'python3 scripts/uyari.py ekle KUR "SINAMA (uyari-test) — gerçek uyarı değil: kur satırı eksik"'
      - name: Uyarı 2 — H1-TEKRAR
        run: 'python3 scripts/uyari.py ekle H1-TEKRAR "SINAMA (uyari-test) — gerçek uyarı değil: sayfada iki h1"'
      - name: Operatör uyarıları
        if: always()
        run: python3 scripts/uyari.py

  ayni-gun-tekrar:
    needs: uyarili
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Uyarı 1 tekrar — KUR (aynı metin, yazılmamalı)
        run: 'python3 scripts/uyari.py ekle KUR "SINAMA (uyari-test) — gerçek uyarı değil: kur satırı eksik"'
      - name: Uyarı 3 — TEKRAR-MANŞET (yeni)
        run: 'python3 scripts/uyari.py ekle TEKRAR-MANŞET "SINAMA (uyari-test) — gerçek uyarı değil: manşet dünküyle aynı"'
      - name: Operatör uyarıları
        if: always()
        run: python3 scripts/uyari.py

  uyarisiz:
    needs: ayni-gun-tekrar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Operatör uyarıları
        if: always()
        run: python3 scripts/uyari.py
