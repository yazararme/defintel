name: collect-news
on:
  schedule:
    - cron: '40 2 * * *'   # 05:40 Türkiye — ajanın 06:00 çalıştırmasından önce
  workflow_dispatch:
    inputs:
      hours:
        description: 'Kaç saatlik pencere taransın'
        default: '48'
      summarise_limit:
        description: 'Kaç kaleme Türkçe özet çıkarılsın (0 = kapalı)'
        default: '0'
      translate_limit:
        description: 'Kaç başlık çevrilsin (0 = hepsi)'
        default: '0'
      dry_run:
        description: 'Yalnızca say, dosya yazma'
        type: boolean
        default: true
permissions:
  contents: write
concurrency: publish
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests google-auth feedparser markdown pyyaml
      - run: npm install -g @anthropic-ai/claude-code
      - env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          DRIVE_FOLDER_ID: 1Bqj-FeX9IwOD9na53Ze7RteepjxRCCGB
        run: |
          python3 scripts/collect_news.py --hours "${{ inputs.hours || '48' }}" \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}
      # Translation runs on the Claude subscription token, not an API key.
      - if: github.event_name == 'schedule' || inputs.dry_run == false
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          python3 scripts/translate_news.py --limit "${{ inputs.translate_limit || '0' }}" \
            || echo "çeviri atlandı"
          if [ "${{ inputs.summarise_limit || '0' }}" != "0" ]; then
            python3 scripts/summarise_news.py --limit "${{ inputs.summarise_limit }}" \
              || echo "özet atlandı"
          fi

      - if: github.event_name == 'schedule' || inputs.dry_run == false
        run: |
          git status --porcelain data/news | grep -q . || exit 0
          python3 build.py
          git config user.name "defintel-bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "news: $(date -u +%F) candidates"
          git pull --rebase --autostash origin main
          git push
