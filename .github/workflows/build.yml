name: build
on:
  push:
    paths: ['source/**', 'build.py', 'enrich.py', 'assets/**', 'scripts/check_reports.py', 'data/rakipler.json']
  workflow_dispatch:
    inputs:
      boz:
        # Rev 22 — DÖRT-DURUM kırmızı kanıtı. Seçilen senaryo için tarayıcıya giden
        # app.js yolda eski hatasıyla değiştirilir; depoya bozuk kod girmez. Bu
        # çalıştırma kırmızı biter, commit atmaz ve uyarıyı "[TEST] " önekli issue'ya yazar.
        description: 'DÖRT-DURUM: bilerek bozulacak senaryo (none = normal build)'
        type: choice
        options: [none, fetch, noresults, yukleniyor, sonuc]
        default: none
      kapsam_boz:
        # Rev 21 — KAPSAM-SAYI kanıtı. Seçilen oyuncunun alias_test'i yalnız bu
        # çalıştırmada bozulur (KAPSAM_BOZ; build.py testine eşleşmeyecek bir pozitif
        # ekler, depoya bozuk veri girmez). Sayfa sayısız üretilir, 375/1440 görüntüsü
        # artifact'e yüklenir, uyarı "[TEST] " önekli issue'ya gider, commit atılmaz.
        description: 'KAPSAM-SAYI: alias testi bilerek bozulacak oyuncu (none = normal build)'
        type: choice
        options: [none, thales, iai, csg]
        default: none
      uyari_test:
        # Rev 23 — genel uyarı kanıtı. Kodu bozmaz: yalnız UYARI_TEST_ONEK: "[TEST] " açar,
        # böylece dal üzerindeki normal derlemenin gerçek uyarıları (ör. 23 Eylül'ün KUR ve
        # H1-TEKRAR'ı) main dışında da "[TEST] DEFINTEL uyarıları · <gün>" issue'suna düşer.
        # Build normal koşar (commit adımı dahil, KAPSAM_BOZ=none olduğu sürece).
        description: 'Uyarıları [TEST] önekli issue''ya yaz (normal build, bozma yok)'
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DORT_DURUM_BOZ: ${{ inputs.boz || 'none' }}
      KAPSAM_BOZ: ${{ inputs.kapsam_boz || 'none' }}
      # Yalnız bilerek bozulan (ya da uyari_test işaretli) çalıştırma test önekiyle (ve main dışında da) issue açar;
      # normal çalıştırmalarda boş → Rev 30 davranışı: issue yalnız main'de.
      UYARI_TEST_ONEK: ${{ ((inputs.boz && inputs.boz != 'none') || (inputs.kapsam_boz && inputs.kapsam_boz != 'none') || inputs.uyari_test == true) && '[TEST] ' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install markdown pyyaml
      - run: python3 build.py

      # Rev 22 — DÖRT-DURUM (bloklayıcı): yeni build'i iş içinde yerel bir porttan sunup
      # başsız Chromium'da dört arama durumunu sınar; (A) özetine geçti/kaldı tablosu yazar.
      # Kalırsa aşağıdaki commit adımı koşmaz (build durur) ve uyarı Rev 30 kanalına gider.
      - name: Playwright kur
        id: pw
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: DÖRT-DURUM
        id: dd
        run: python3 scripts/check_reports.py --dort-durum --out "$RUNNER_TEMP/dort-durum"
      - name: DÖRT-DURUM koşamadı
        if: always() && steps.pw.outcome == 'failure'
        run: python3 scripts/uyari.py ekle DÖRT-DURUM "denetim koşamadı — Playwright kurulamadı, build durdu"
      # Görüntüler: GitHub özet sanitizer'ı data: URI'lı <img>'i siler, göreli yol da
      # çözülmez; bu yüzden görüntüler artifact olarak yüklenir ve özete bağlantısı yazılır.
      - name: DÖRT-DURUM görüntüleri (artifact)
        id: art
        if: always() && steps.dd.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: dort-durum-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dort-durum/*.png
          if-no-files-found: warn
          retention-days: 30
      - name: DÖRT-DURUM görüntüleri (özet bağlantısı)
        if: always() && steps.dd.outcome != 'skipped'
        env:
          ART_URL: ${{ steps.art.outputs.artifact-url }}
        run: |
          {
            echo "#### DÖRT-DURUM görüntüleri"
            echo
            if [ -n "$ART_URL" ]; then
              echo "Dört senaryonun ekran görüntüsü (1-fetch, 2-noresults, 3-yukleniyor, 4-sonuc): [artifact'i indir]($ART_URL)"
            else
              echo "🔴 görüntü artifact'i yüklenemedi."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Rev 21 — KAPSAM-SAYI (S) kanıtı: /oyuncular.html 375 ve 1440 px, tam sayfa; Tümü + "Mühimmat" çipi (açık/koyu).
      # Her çalıştırmada; kapsam_boz seçiliyse bu, sayısız hâlin görüntüsüdür.
      - name: KAPSAM-SAYI görüntüleri
        id: ks
        if: always() && steps.pw.outcome == 'success'
        continue-on-error: true   # kanıt adımı: build'i durdurmaz, (A) tablosunda 🔴 olur
        run: python3 scripts/check_reports.py --oyuncular --out "$RUNNER_TEMP/kapsam-sayi"
      - name: KAPSAM-SAYI görüntüleri (artifact)
        id: ksart
        if: always() && steps.ks.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: kapsam-sayi-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kapsam-sayi/*.png
          if-no-files-found: warn
          retention-days: 30
      - name: KAPSAM-SAYI görüntüleri (özet bağlantısı)
        if: always() && steps.ks.outcome != 'skipped'
        env:
          ART_URL: ${{ steps.ksart.outputs.artifact-url }}
        run: |
          {
            echo "#### KAPSAM-SAYI görüntüleri"
            echo
            if [ -n "$ART_URL" ]; then
              echo "/oyuncular.html (1-2: Tümü 375/1440; 3-6: Mühimmat çipi açık, 375/1440, açık/koyu; KAPSAM_BOZ=$KAPSAM_BOZ): [artifact'i indir]($ART_URL)"
            else
              echo "🔴 görüntü artifact'i yüklenemedi."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Bilerek bozulan KAPSAM-SAYI çalıştırması yayına gitmez: sayısız sayfa yalnız kanıttır.
      - if: env.KAPSAM_BOZ == 'none'
        run: |
          git config user.name "defintel-bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "build: $(date -u +%F)"
          git push

      # Rev 30 — operatör uyarıları: günün tek issue'su (yalnız main). Son adım, her koşulda.
      - name: Operatör uyarıları
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/uyari.py
