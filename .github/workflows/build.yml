name: build
on:
  push:
    paths: ['source/**', 'build.py', 'assets/**']
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install markdown pyyaml
      - run: python3 build.py
      - run: |
          git config user.name "defintel-bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "build: $(date -u +%F)"
          git push

      # Rev 30 — operatör uyarıları: günün tek issue'su (yalnız main). Son adım, her koşulda.
      - name: Operatör uyarıları
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/uyari.py
